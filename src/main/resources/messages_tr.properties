# PauseLinks mesajları (MiniMessage). <prefix> aşağıdaki önekle değişir (arkasına bir boşluk bırak).
# Değişkenler: <arg:0>, <arg:1>, ... Oyuncu, oyun dili Türkçe ise bu dosyayı görür.
prefix=<aqua>PauseLinks</aqua> <dark_gray>»</dark_gray>
header=<dark_gray><strikethrough>                </strikethrough></dark_gray> <aqua><bold>SUNUCU BAĞLANTILARI</bold></aqua> <dark_gray><strikethrough>                </strikethrough></dark_gray>
footer=<gray>Açmak için bir bağlantıya <white>tıkla</white>. Duraklatma menüsünde de var: <white>Escape > Sunucu Bağlantıları</white></gray>
line=<dark_gray> ▸ </dark_gray><arg:0> <dark_gray>—</dark_gray> <gray><arg:1></gray>
hover-url=<gray>Tıkla ve aç:</gray> <white><arg:0></white>
hover-command=<gray>Tıkla ve çalıştır:</gray> <white><arg:0></white>
single=<arg:0> <dark_gray>▸</dark_gray> <arg:1> <dark_gray>—</dark_gray> <gray><arg:2></gray>
single-missing=<prefix> <red>Bu bağlantı tanımlı değil.</red> <gray>Tüm bağlantılar: <white>/links</white></gray>
list-empty=<prefix> <red>Tanımlı bağlantı yok. <gray>config.yml dosyasına ekleyebilirsin.</gray>
list-disabled=<prefix> <gray>Bağlantı listesi kapalı. Bağlantılarımız <white>Escape > Sunucu Bağlantıları</white> menüsünde.</gray>
reloaded=<prefix> <green><arg:0> bağlantı yeniden yüklendi.</green>
reload-failed=<prefix> <red>Ayarlar okunamadı, sunucu konsoluna bak.</red>
pack-updated=<prefix> <yellow>Duraklatma menüsü ekranı güncellendi. Görünmesi için sunucuyu yeniden başlat.</yellow>
status=<prefix> <gray>Aktif bağlantı: <white><arg:0></white> <dark_gray>|</dark_gray> Sürüm: <white><arg:1></white></gray>
no-permission=<prefix> <red>Bunun için yetkin yok.</red>
