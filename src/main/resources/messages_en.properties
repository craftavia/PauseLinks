# PauseLinks messages (MiniMessage). <prefix> is replaced with the prefix below (put a space after it).
# Arguments: <arg:0>, <arg:1>, ... Players see the file matching their client language.
prefix=<aqua>PauseLinks</aqua> <dark_gray>»</dark_gray>
header=<dark_gray><strikethrough>                </strikethrough></dark_gray> <aqua><bold>SERVER LINKS</bold></aqua> <dark_gray><strikethrough>                </strikethrough></dark_gray>
footer=<gray>Click a link to open it. Also in the pause menu: <white>Escape > Server Links</white></gray>
line=<dark_gray> ▸ </dark_gray><arg:0> <dark_gray>—</dark_gray> <gray><arg:1></gray>
hover-url=<gray>Click to open:</gray> <white><arg:0></white>
hover-command=<gray>Click to run:</gray> <white><arg:0></white>
single=<arg:0> <dark_gray>▸</dark_gray> <arg:1> <dark_gray>—</dark_gray> <gray><arg:2></gray>
single-missing=<prefix> <red>This link is not configured.</red> <gray>All links: <white>/links</white></gray>
list-empty=<prefix> <red>No links configured. <gray>Add them to config.yml.</gray>
list-disabled=<prefix> <gray>The link list is disabled. Find our links in <white>Escape > Server Links</white>.</gray>
reloaded=<prefix> <green>Reloaded <arg:0> links.</green>
reload-failed=<prefix> <red>Could not read the configuration, check the server console.</red>
pack-updated=<prefix> <yellow>The pause menu screen was updated. Restart the server to apply it.</yellow>
status=<prefix> <gray>Active links: <white><arg:0></white> <dark_gray>|</dark_gray> Version: <white><arg:1></white></gray>
no-permission=<prefix> <red>You do not have permission to do that.</red>
